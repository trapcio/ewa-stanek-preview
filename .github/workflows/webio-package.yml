name: Build Webio package

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4

      - name: Prepare Webio files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' ./ dist/

          while IFS= read -r -d '' file; do
            sed -i 's#/ewa-stanek-preview/#/#g' "$file"
          done < <(find dist -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' \) -print0)

          test -f dist/index.html
          for version in 2 3 4 5 6 7 8; do
            test -f "dist/wersja-$version/index.html"
          done

          if grep -R -n --include='*.html' --include='*.css' --include='*.js' --include='*.json' '/ewa-stanek-preview/' dist; then
            echo "GitHub Pages base path still present in Webio package."
            exit 1
          fi

      - name: Upload Webio package
        uses: actions/upload-artifact@v4
        with:
          name: ewa-stanek-webio
          path: dist/
          if-no-files-found: error
          retention-days: 7
