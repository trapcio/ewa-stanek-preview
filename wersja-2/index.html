<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="">
  <meta name="theme-color" content="#153f38">
  <title>Ewa Stanek | Fizjoterapia dziecięca</title>
  <link rel="stylesheet" href="style-a.css">
  <link rel="stylesheet" href="style-b.css">
  <link rel="stylesheet" href="style-c.css">
</head>
<body>
  <div class="compare-bar">
    <div class="wrap compare-inner">
      <span id="compareLabel"></span>
      <a id="compareLink" href="../"></a>
    </div>
  </div>

  <nav>
    <div class="wrap nav-inner">
      <a class="brand" href="#start" aria-label="Ewa Stanek – początek strony">
        <span class="brand-mark">ES</span>
        <span><strong id="brandName"></strong><small id="brandSubtitle"></small></span>
      </a>
      <div class="nav-links" id="navLinks"></div>
    </div>
  </nav>

  <div id="contentError" class="content-error" hidden>
    Nie udało się wczytać treści strony z pliku content.json.
  </div>

  <main id="start">
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <div class="eyebrow" id="heroEyebrow"></div>
          <h1 id="heroTitle"></h1>
          <p class="hero-lead" id="heroLead"></p>
          <div class="hero-actions">
            <a class="btn primary" id="heroPrimary" target="_blank" rel="noopener"></a>
            <a class="btn secondary" id="heroSecondary"></a>
          </div>
          <div class="hero-trust" id="heroTrust"></div>
        </div>

        <div class="hero-photo">
          <img id="heroImage" src="" alt="">
          <div class="photo-note">
            <strong id="heroNoteTitle"></strong>
            <span id="heroNoteText"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="answers">
      <div class="wrap">
        <div class="answers-card">
          <div>
            <div class="eyebrow light" id="answersEyebrow"></div>
            <h2 id="answersTitle"></h2>
          </div>
          <div class="answer-list" id="answerList"></div>
        </div>
      </div>
    </section>

    <section id="kiedy">
      <div class="wrap">
        <div class="section-head">
          <div>
            <div class="eyebrow" id="whenEyebrow"></div>
            <h2 id="whenTitle"></h2>
          </div>
          <p id="whenIntro"></p>
        </div>
        <div class="concern-grid" id="concernGrid"></div>
      </div>
    </section>

    <section class="guide-section" aria-labelledby="guideTitle">
      <div class="wrap guide-shell">
        <div class="guide-copy">
          <div class="eyebrow light" id="guideEyebrow"></div>
          <h2 id="guideTitle"></h2>
          <p id="guideIntro"></p>
          <div class="age-tabs" id="ageTabs" role="group" aria-label="Wiek dziecka"></div>
          <div id="concernButtons" class="concern-buttons" aria-live="polite"></div>
        </div>
        <div class="guide-result" id="guideResult"></div>
      </div>
    </section>

    <section id="pierwsza-wizyta">
      <div class="wrap">
        <div class="section-head compact">
          <div>
            <div class="eyebrow" id="visitEyebrow"></div>
            <h2 id="visitTitle"></h2>
          </div>
          <p id="visitIntro"></p>
        </div>
        <div class="visit-steps" id="visitSteps"></div>
        <div class="practical-box">
          <h3 id="practicalTitle"></h3>
          <div class="practical-grid" id="practicalGrid"></div>
        </div>
      </div>
    </section>

    <section id="o-mnie" class="about-section">
      <div class="wrap about-grid">
        <div class="about-photo">
          <img id="aboutImage" src="" alt="">
          <span id="aboutImageCaption"></span>
        </div>
        <div class="about-copy">
          <div class="eyebrow" id="aboutEyebrow"></div>
          <h2 id="aboutTitle"></h2>
          <div id="aboutParagraphs"></div>
          <div class="method-row" id="methodRow"></div>
        </div>
      </div>
    </section>

    <section class="development-section">
      <div class="wrap">
        <div class="development-head">
          <div>
            <div class="eyebrow" id="developmentEyebrow"></div>
            <h2 id="developmentTitle"></h2>
          </div>
          <p id="developmentIntro"></p>
        </div>
        <p class="template-note" id="developmentNote"></p>
        <div class="course-grid" id="courseGrid"></div>
      </div>
    </section>

    <section class="video-section">
      <div class="wrap video-card">
        <div>
          <div class="eyebrow light" id="videoEyebrow"></div>
          <h2 id="videoTitle"></h2>
          <p id="videoText"></p>
        </div>
        <div class="video-placeholder" aria-label="Miejsce na przyszłe wideo">
          <span>▶</span>
          <strong id="videoPlaceholderTitle"></strong>
          <small id="videoPlaceholderMeta"></small>
        </div>
      </div>
    </section>

    <section id="opinie">
      <div class="wrap">
        <div class="section-head compact">
          <div>
            <div class="eyebrow" id="reviewsEyebrow"></div>
            <h2 id="reviewsTitle"></h2>
          </div>
          <p id="reviewsIntro"></p>
        </div>
        <div class="reviews" id="reviewsGrid"></div>
      </div>
    </section>

    <section class="faq-section">
      <div class="wrap">
        <div class="section-head compact">
          <div>
            <div class="eyebrow" id="faqEyebrow"></div>
            <h2 id="faqTitle"></h2>
          </div>
        </div>
        <div class="faq" id="faqList"></div>
      </div>
    </section>

    <section class="contact-section">
      <div class="wrap contact-card">
        <div>
          <div class="eyebrow light" id="contactEyebrow"></div>
          <h2 id="contactTitle"></h2>
          <p id="contactText"></p>
        </div>
        <div class="contact-actions">
          <a class="btn white" id="contactButton" target="_blank" rel="noopener"></a>
          <span id="contactAddress"></span>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <div><strong id="footerName"></strong><span id="footerSubtitle"></span></div>
      <a id="footerCompare" href="../"></a>
    </div>
  </footer>

  <script src="content.js"></script>
</body>
</html>
