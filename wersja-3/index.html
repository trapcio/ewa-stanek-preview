<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="">
  <meta name="theme-color" content="#173f39">
  <title>Ewa Stanek | Fizjoterapia dziecięca</title>
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="stylesheet" href="/ewa-stanek-preview/shared/theme-switcher.css?v=1">
  <link rel="stylesheet" href="/ewa-stanek-preview/shared/theme-overrides.css?v=1">
</head>
<body>
<div class="global-preview-switcher">
  <div class="gps-inner">
    <div class="gps-versions">
      <span class="gps-label">Porównaj wersje:</span>
      <a href="/ewa-stanek-preview/">Wersja 1</a>
      <a href="/ewa-stanek-preview/wersja-2/">Wersja 2</a>
      <a class="current" href="/ewa-stanek-preview/wersja-3/">Wersja 3</a>
      <a href="/ewa-stanek-preview/wersja-4/">Wersja 4</a>
    </div>
    <label class="gps-theme">
      <span>Kolorystyka:</span>
      <select id="globalThemeSelect" aria-label="Wybierz kolorystykę strony">
        <option value="sage">Szałwia</option>
        <option value="sand">Piaskowy</option>
        <option value="blush">Pudrowy</option>
        <option value="sky">Jasny błękit</option>
        <option value="pure">Czysta biel</option>
        <option value="pearl">Perłowa</option>
        <option value="coolwhite">Chłodna biel</option>
        <option value="mist">Mglista biel</option>
        <option value="mint">Biała mięta</option>
        <option value="lavender">Biała lawenda</option>
        <option value="rosewhite">Różowa biel</option>
      </select>
    </label>
  </div>
</div>
<nav>
    <div class="wrap nav-inner">
      <a class="brand" href="#start"><span class="mark">ES</span><span><strong id="brandName"></strong><small id="brandSubtitle"></small></span></a>
      <a class="nav-cta" id="navBooking" target="_blank" rel="noopener">Umów wizytę</a>
    </div>
  </nav>

  <main id="start">
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <div class="eyebrow" id="heroEyebrow"></div>
          <h1 id="heroTitle"></h1>
          <h2 id="heroSubtitle"></h2>
          <p class="hero-lead" id="heroLead"></p>
          <p class="hero-text" id="heroText"></p>
          <a class="btn" id="heroBooking" target="_blank" rel="noopener"></a>
        </div>
        <div class="hero-photo"><img id="heroImage" src="" alt=""></div>
      </div>
    </section>

    <section id="o-mnie">
      <div class="wrap two-col">
        <div><div class="eyebrow" id="aboutEyebrow"></div><h2 id="aboutTitle"></h2></div>
        <div id="aboutParagraphs" class="prose"></div>
      </div>
    </section>

    <section class="soft">
      <div class="wrap two-col">
        <div><div class="eyebrow" id="scopeEyebrow"></div><h2 id="scopeTitle"></h2></div>
        <div class="scope-list" id="scopeList"></div>
      </div>
    </section>

    <section>
      <div class="wrap experience-grid">
        <div class="experience-copy"><div class="eyebrow" id="experienceEyebrow"></div><h2 id="experienceTitle"></h2><div class="highlight" id="experienceHighlight"></div></div>
        <div class="method-list" id="methodList"></div>
      </div>
    </section>

    <section class="development">
      <div class="wrap">
        <div class="two-col development-head">
          <div><div class="eyebrow" id="developmentEyebrow"></div><h2 id="developmentTitle"></h2></div>
          <p id="developmentText"></p>
        </div>
        <p class="template-note" id="developmentNote"></p>
        <div class="courses" id="courses"></div>
      </div>
    </section>

    <section class="contact">
      <div class="wrap contact-card">
        <div><div class="eyebrow light" id="contactEyebrow"></div><h2 id="contactTitle"></h2><p id="contactAddress"></p><small id="contactNote"></small></div>
        <a class="btn light-btn" id="contactBooking" target="_blank" rel="noopener"></a>
      </div>
    </section>
  </main>

  <footer><div class="wrap footer-inner"><span>© Ewa Stanek · fizjoterapia dziecięca</span><a id="compareLink"></a></div></footer>

  <script src="content.js?v=1"></script>
  <script src="/ewa-stanek-preview/shared/themes.js?v=1"></script>
</body>
</html>
